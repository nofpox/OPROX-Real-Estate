kind = "web"
previewPath = "/realestate/"
title = "Real Estate Portal"
version = "1.0.0"
id = "artifacts/realestate-portal"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/realestate/" ]
localPort = 19855

[services.development]
run = "pnpm --filter @workspace/rozoz-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rozoz-portal", "run", "build" ]
publicDir = "artifacts/realestate-portal/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19855"
BASE_PATH = "/realestate/"
