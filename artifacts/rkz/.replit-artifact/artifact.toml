kind = "mobile"
previewPath = "/rkz/"
title = "Rkz — Real Estate Aggregator"
version = "1.0.0"
id = "artifacts/rkz"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/rkz/", "/rkz" ]
localPort = 26232

[services.development]
run = "pnpm --filter @workspace/rkz run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rkz", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/rkz", "run", "serve" ]

[services.env]
PORT = "26232"
BASE_PATH = "/rkz/"
