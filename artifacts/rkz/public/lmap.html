<!DOCTYPE html>
<html dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,user-scalable=yes"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body,#map{height:100%;width:100%;background:#0f2040;}

/* ── Filter bar — horizontal scroll at top ── */
#filter-bar{
  position:absolute;top:10px;left:8px;right:8px;
  z-index:1000;display:flex;flex-direction:row;gap:6px;
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  flex-wrap:nowrap;padding:4px 0;
}
#filter-bar::-webkit-scrollbar{display:none;}
.fbtn{
  flex-shrink:0;padding:6px 13px;border-radius:20px;
  border:1.5px solid rgba(255,255,255,0.22);
  background:rgba(10,22,40,0.86);color:#cbd5e1;
  font-size:12px;font-family:-apple-system,'Segoe UI',Tahoma,sans-serif;font-weight:700;
  cursor:pointer;white-space:nowrap;
  -webkit-tap-highlight-color:transparent;user-select:none;
  transition:background .12s,border-color .12s;
}
.fbtn.active{background:rgba(15,52,96,0.95);border-color:#C9A84C;color:#C9A84C;}
.fbtn.active-apt{background:rgba(55,20,100,0.95);border-color:#A855F7;color:#A855F7;}
.fbtn:hover{opacity:.85;}

/* ── Status pill ── */
#status-bar{position:absolute;top:60px;left:0;right:0;z-index:1001;display:none;align-items:center;justify-content:center;pointer-events:none;}
#status-pill{background:rgba(10,22,40,0.92);border:1px solid rgba(201,168,76,.4);border-radius:20px;padding:5px 14px;font-family:-apple-system,'Segoe UI',Tahoma,sans-serif;font-size:12px;color:#C9A84C;font-weight:600;}

/* ── Zoom hint ── */
#zoom-hint{position:absolute;top:60px;left:0;right:0;z-index:1001;display:none;align-items:center;justify-content:center;pointer-events:none;}
#zoom-pill{background:rgba(10,22,40,0.88);border:1px solid rgba(255,255,255,0.14);border-radius:20px;padding:5px 14px;font-family:-apple-system,'Segoe UI',Tahoma,sans-serif;font-size:12px;color:rgba(255,255,255,0.7);font-weight:600;}

/* ── Spot icons ── */
.spot-icon{overflow:visible!important;background:none!important;border:none!important;}
.spot-wrap{display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-50%);cursor:pointer;}
.spot-pin{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;font-size:18px;position:relative;box-shadow:0 4px 14px rgba(0,0,0,.7);border:2px solid rgba(255,255,255,.18);background:rgba(10,22,40,.55);}
.spot-pin.feat{width:48px;height:48px;font-size:22px;border-color:#D4A843;box-shadow:0 4px 18px rgba(212,168,67,.5);}
.busy-ring{position:absolute;inset:-5px;border-radius:50%;border:3px solid transparent;pointer-events:none;}
.ring-green{border-color:#22c55e;box-shadow:0 0 7px rgba(34,197,94,.4);}
.ring-yellow{border-color:#eab308;box-shadow:0 0 7px rgba(234,179,8,.4);}
.ring-red{border-color:#ef4444;animation:pulse-red 1.5s infinite;}
.ring-gray{border-color:#94a3b8;opacity:.4;}
@keyframes pulse-red{0%,100%{box-shadow:0 0 4px rgba(239,68,68,.3);}50%{box-shadow:0 0 12px rgba(239,68,68,.8);}}
.star-lbl{margin-top:4px;padding:2px 8px;border-radius:9px;font-size:10px;white-space:nowrap;font-weight:700;font-family:-apple-system,'Segoe UI',sans-serif;background:rgba(10,22,40,.82);color:#fbbf24;border:1px solid rgba(212,168,67,.3);box-shadow:0 2px 6px rgba(0,0,0,.5);}
.star-lbl.dim{color:#94a3b8;border-color:rgba(148,163,184,.2);}

/* ── Popups ── */
.lf-popup .leaflet-popup-content-wrapper{background:#0f2040;border:1.5px solid #C9A84C;border-radius:14px;box-shadow:0 8px 26px rgba(0,0,0,.65);color:#f1f5f9;padding:0;font-family:-apple-system,'Segoe UI',Tahoma,sans-serif;}
.lf-popup .leaflet-popup-tip-container{display:none;}
.lf-popup .leaflet-popup-content{margin:14px;min-width:190px;max-width:255px;}
.lf-popup .leaflet-popup-close-button{color:#94a3b8!important;top:8px;font-size:18px;}
.pop-type{font-size:10px;font-weight:800;margin-bottom:5px;letter-spacing:.4px;}
.pop-name{font-size:14px;font-weight:700;color:#fff;margin-bottom:4px;line-height:1.4;}
.pop-city{font-size:11px;color:#D4A843;margin-bottom:3px;}
.pop-desc{font-size:11px;color:rgba(241,245,249,.58);line-height:1.55;margin-bottom:8px;}
.pop-stars-row{display:flex;align-items:center;gap:5px;margin-bottom:8px;}
.pop-stars{font-size:13px;color:#fbbf24;}
.pop-rating-num{font-size:12px;font-weight:700;color:#fbbf24;}
.pop-busy{background:rgba(255,255,255,.06);border-radius:9px;padding:8px 11px;margin-bottom:10px;}
.pop-busy-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.pop-busy-title{font-size:10px;color:rgba(255,255,255,.4);}
.pop-busy-val{font-size:11px;font-weight:700;}
.pop-bar-track{height:4px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;}
.pop-bar-fill{height:100%;border-radius:3px;}
.pop-addr{font-size:11px;color:rgba(241,245,249,.52);margin-bottom:9px;line-height:1.5;}
.pop-btn{display:flex;align-items:center;justify-content:center;gap:5px;background:#D4A843;color:#0F2040;font-weight:700;font-size:11px;padding:7px 12px;border-radius:9px;text-decoration:none;width:100%;cursor:pointer;}
.pop-btn:hover{background:#c99a36;}
.pop-call{display:flex;align-items:center;justify-content:center;gap:5px;background:#16a34a;color:#fff;font-weight:700;font-size:11px;padding:7px 12px;border-radius:9px;text-decoration:none;width:100%;cursor:pointer;margin-bottom:7px;}
.pop-call:hover{background:#15803d;}
.pop-no-phone{font-size:10px;color:#475569;text-align:center;padding:3px 0 5px;}
.apt-price{font-size:14px;font-weight:800;color:#C9A84C;margin:4px 0 6px;}
.ride-btns{display:flex;gap:5px;margin-top:8px;}
.ride-btn{flex:1;padding:8px 4px;border-radius:9px;font-size:11px;font-weight:700;text-align:center;cursor:pointer;border:none;font-family:-apple-system,'Segoe UI',Tahoma,sans-serif;}
.ride-btn:hover{opacity:.85;}
.ride-uber{background:#000;color:#fff;}
.ride-bolt{background:#34D399;color:#000;}
.ride-careem{background:#00B140;color:#fff;}

/* ── Leaflet controls ── */
.leaflet-control-container>*{display:none!important;}
.leaflet-control-container .leaflet-bottom.leaflet-right{display:block!important;}
.leaflet-control-attribution{background:rgba(10,22,40,.7)!important;color:#475569!important;font-size:9px!important;display:block!important;}
.leaflet-control-attribution a{color:#C9A84C!important;}
.leaflet-tile-container img{width:256.5px!important;height:256.5px!important;}

#loading-overlay{position:absolute;inset:0;background:#0f2040;z-index:9999;display:flex;align-items:center;justify-content:center;font-family:-apple-system,sans-serif;color:#C9A84C;font-size:14px;}
</style>
</head>
<body>
<div id="loading-overlay">جاري التحميل…</div>
<div id="map"></div>
<div id="status-bar"><div id="status-pill"></div></div>
<div id="zoom-hint"><div id="zoom-pill"></div></div>
<div id="filter-bar">
  <button class="fbtn active" id="btn-all"></button>
  <button class="fbtn" id="btn-att"></button>
  <button class="fbtn" id="btn-hot"></button>
  <button class="fbtn" id="btn-rest"></button>
  <button class="fbtn" id="btn-cafe"></button>
  <button class="fbtn" id="btn-apt"></button>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  var map, tourismLayer, poiLayer;
  var IS_AR=false, USER_LAT=24.7136, USER_LNG=46.6753, SPOTS=[];
  var APTS={};
  var currentFilter=null;
  var poiXhr=null;

  /* ── Busy-level simulation ── */
  var PAT={cultural:[[8,11,55],[11,14,45],[14,17,70],[17,21,78],[21,23,42]],events:[[9,12,25],[12,15,20],[15,17,40],[17,20,88],[20,23,82]],nature:[[6,9,68],[9,12,58],[12,15,38],[15,18,62],[18,20,30]],entertainment:[[10,13,32],[13,16,48],[16,19,65],[19,22,92],[22,24,72]],religious:[[4,6,82],[11,13,95],[14,16,72],[17,20,88],[20,22,68]]};
  var WKD=[5,6];
  function ksaH(){return(new Date().getUTCHours()+3)%24;}
  function ksaD(){var n=new Date(),h=n.getUTCHours()+3;return(n.getUTCDay()+(h>=24?1:0))%7;}
  function hash(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))&0xffff;return h;}
  function calcBusy(id,cat){var pts=PAT[cat];if(!pts)return null;var h=ksaH(),d=ksaD(),b=10;for(var i=0;i<pts.length;i++){var p=pts[i];if(h>=p[0]&&h<p[1]){b=p[2];break;}}if(WKD.indexOf(d)!==-1)b=Math.min(100,b+22);return Math.max(0,Math.min(100,Math.round(b+((hash(id)%25)-12))));}
  function busyInfo(pct){if(pct===null)return{cls:'gray',dot:'⚫',lbl:IS_AR?'لا بيانات':'No data',clr:'#94a3b8'};if(pct<40)return{cls:'green',dot:'🟢',lbl:IS_AR?'رايق':'Quiet',clr:'#22c55e'};if(pct<75)return{cls:'yellow',dot:'🟡',lbl:IS_AR?'وسط':'Moderate',clr:'#eab308'};return{cls:'red',dot:'🔴',lbl:IS_AR?'زحمة':'Busy',clr:'#ef4444'};}
  function stars(r){var f=Math.floor(r),h=(r-f)>=.5?1:0;return'★'.repeat(f)+(h?'½':'')+('☆'.repeat(5-f-h));}
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  var CAT_CLR={cultural:'#60A5FA',events:'#A78BFA',nature:'#4ADE80',entertainment:'#FB923C',religious:'#D4A843'};
  var CAT_AR={cultural:'ثقافي',events:'فعاليات',nature:'طبيعة',entertainment:'ترفيه',religious:'ديني'};
  var CAT_EN={cultural:'Cultural',events:'Events',nature:'Nature',entertainment:'Entertainment',religious:'Religious'};
  var POI_CLR={attraction:'#16A34A',hotel:'#3B82F6',restaurant:'#EF4444',cafe:'#92400E',apartment:'#A855F7',historic:'#D97706'};

  function showStatus(msg){var bar=document.getElementById('status-bar');var pill=document.getElementById('status-pill');if(msg){pill.textContent=msg;bar.style.display='flex';}else{bar.style.display='none';}}
  function showZoomHint(show){
    var el=document.getElementById('zoom-hint');
    var pill=document.getElementById('zoom-pill');
    if(show){pill.textContent=IS_AR?'🔍 زوم للداخل لرؤية الأماكن':'🔍 Zoom in to see places';el.style.display='flex';}
    else{el.style.display='none';}
  }

  /* ── Tourism landmark icons ── */
  function makeEmojiIcon(s,pct){var info=busyInfo(pct);var clr=CAT_CLR[s.category]||'#D4A843';var fc=s.featured?' feat':'';var rlbl=s.rating?'<div class="star-lbl">⭐ '+s.rating.toFixed(1)+'</div>':'<div class="star-lbl dim">—</div>';return L.divIcon({html:'<div class="spot-wrap"><div class="spot-pin'+fc+'" style="border-color:'+clr+'">'+s.emoji+'<div class="busy-ring ring-'+info.cls+'"></div></div>'+rlbl+'</div>',className:'spot-icon',iconSize:[0,0],iconAnchor:[0,0]});}
  function makeTourismPopup(s,pct){var info=busyInfo(pct);var clr=CAT_CLR[s.category]||'#D4A843';var catL=IS_AR?(CAT_AR[s.category]||s.category):(CAT_EN[s.category]||s.category);var barH=pct!==null?'<div class="pop-bar-track"><div class="pop-bar-fill" style="width:'+pct+'%;background:'+info.clr+'"></div></div>':'';var stH=s.rating?'<div class="pop-stars-row"><span class="pop-stars">'+stars(s.rating)+'</span><span class="pop-rating-num">'+s.rating.toFixed(1)+'</span></div>':'';return '<span class="pop-type" style="color:'+clr+'">'+esc(catL)+'</span><div class="pop-name">'+esc(IS_AR?s.nameAr:s.nameEn)+'</div><div class="pop-city">📍 '+esc(IS_AR?s.cityAr:s.cityEn)+'</div>'+stH+'<div class="pop-desc">'+esc(IS_AR?(s.descAr||''):(s.descEn||''))+'</div>'+(pct!==null?'<div class="pop-busy"><div class="pop-busy-row"><span class="pop-busy-title">'+(IS_AR?'الزحمة':'Busyness')+'</span><span class="pop-busy-val" style="color:'+info.clr+'">'+info.dot+' '+info.lbl+'</span></div>'+barH+'</div>':'')+'<a class="pop-btn" href="'+s.mapsUrl+'" target="_blank">🗺️ '+(IS_AR?'افتح في الخريطة':'Open Maps')+'</a>';}
  function renderTourism(){
    if(!tourismLayer)return;
    tourismLayer.clearLayers();
    SPOTS.forEach(function(s){
      var pct=calcBusy(s.id,s.category);
      L.marker([s.lat,s.lng],{icon:makeEmojiIcon(s,pct)})
        .bindPopup(makeTourismPopup(s,pct),{className:'lf-popup',maxWidth:275,closeButton:true})
        .addTo(tourismLayer);
    });
  }

  /* ── Apt popup with ride buttons ── */
  window.openRide=function(app,apId){var d=APTS[apId];if(!d)return;var urls={uber:'uber://?action=setPickup&pickup=my_location&dropoff[latitude]='+d.lat+'&dropoff[longitude]='+d.lng+'&dropoff[nickname]='+encodeURIComponent(d.name),bolt:'bolt://pickup=my_location&dropoff_lat='+d.lat+'&dropoff_lon='+d.lng,careem:'careem://booking/pickup/current/dropoff/'+d.lat+'/'+d.lng};window.open(urls[app],'_system');};
  function makeAptPopup(el){var tags=el.tags||{};var name=IS_AR?(tags['name:ar']||tags.name||''):(tags['name:en']||tags.name||'');if(!name)name=IS_AR?'شقة مفروشة':'Furnished Apt.';var phone=tags.phone||tags['contact:phone']||'';var apId='apt_'+el.id;APTS[apId]={lat:el.lat,lng:el.lon,name:name};var h='<span class="pop-type" style="color:#A855F7">🏠 '+(IS_AR?'شقة مفروشة':'Furnished Apt.')+'</span>';h+='<div class="pop-name">'+esc(name)+'</div>';h+=phone?'<a class="pop-call" href="tel:'+phone.replace(/\s/g,'')+'">📞 '+(IS_AR?'اتصال':'Call')+'</a>':'<div class="pop-no-phone">'+(IS_AR?'لا يوجد هاتف':'No phone')+'</div>';h+='<div class="ride-btns"><button class="ride-btn ride-uber" onclick="openRide(\'uber\',\''+apId+'\')">🚗 Uber</button><button class="ride-btn ride-bolt" onclick="openRide(\'bolt\',\''+apId+'\')">⚡ Bolt</button><button class="ride-btn ride-careem" onclick="openRide(\'careem\',\''+apId+'\')">🟢 Careem</button></div>';return h;}

  /* ── Generic POI popup ── */
  function makePOIPopup(el,type){var tags=el.tags||{};var name=IS_AR?(tags['name:ar']||tags.name||''):(tags['name:en']||tags.name||'');if(!name)name=IS_AR?'اسم غير متاح':'N/A';var phone=tags.phone||tags['contact:phone']||tags['contact:mobile']||'';var addr='';var ap=[];if(tags['addr:city'])ap.push(tags['addr:city']);if(tags['addr:street'])ap.push(tags['addr:street']);addr=ap.join(' — ');var clr=POI_CLR[type]||'#64748B';var emojiMap={attraction:'🎯',hotel:'🏨',restaurant:'🍽️',cafe:'☕',apartment:'🏠',historic:'🏛️'};var emoji=emojiMap[type]||'📍';var arName={attraction:'سياحي',hotel:'فندق',restaurant:'مطعم',cafe:'كافيه',apartment:'شقق',historic:'تاريخي'};var enName={attraction:'Tourism',hotel:'Hotel',restaurant:'Restaurant',cafe:'Café',apartment:'Apt.',historic:'Historic'};var h='<div class="pop-type" style="color:'+clr+'">'+emoji+' '+(IS_AR?(arName[type]||type):(enName[type]||type))+'</div>';h+='<div class="pop-name">'+esc(name)+'</div>';if(addr)h+='<div class="pop-addr">📍 '+esc(addr)+'</div>';h+=phone?'<a class="pop-call" href="tel:'+phone.replace(/\s/g,'')+'">📞 '+(IS_AR?'اتصال':'Call')+'</a>':'<div class="pop-no-phone">'+(IS_AR?'لا يوجد هاتف':'No phone')+'</div>';return h;}

  /* ── Overpass POI loading ── */
  function buildOverpassQuery(type,bounds){
    var s=bounds.getSouth(),w=bounds.getWest(),n=bounds.getNorth(),e=bounds.getEast();
    var bb='('+s+','+w+','+n+','+e+')';
    var q='[out:json][timeout:25];(';
    if(!type||type==='all'){
      q+='node["amenity"="restaurant"]'+bb+';';
      q+='node["amenity"~"cafe|coffee_shop"]'+bb+';';
      q+='node["tourism"~"hotel|motel|resort"]'+bb+';';
      q+='node["tourism"="attraction"]'+bb+';';
      q+='node["historic"]'+bb+';';
    }else if(type==='attraction'){
      q+='node["tourism"="attraction"]'+bb+';';
      q+='node["historic"]'+bb+';';
    }else if(type==='hotel'){
      q+='node["tourism"~"hotel|motel|resort"]'+bb+';';
    }else if(type==='restaurant'){
      q+='node["amenity"="restaurant"]'+bb+';';
    }else if(type==='cafe'){
      q+='node["amenity"~"cafe|coffee_shop"]'+bb+';';
    }else if(type==='apartment'){
      q+='node["tourism"~"apartment|guest_house|hostel"]'+bb+';';
    }
    return q+');out 150;';
  }

  function getPoiType(el){
    var t=el.tags||{};
    if(t.tourism==='attraction')return 'attraction';
    if(t.tourism&&['hotel','motel','resort'].indexOf(t.tourism)!==-1)return 'hotel';
    if(t.amenity==='restaurant')return 'restaurant';
    if(t.amenity==='cafe'||t.amenity==='coffee_shop')return 'cafe';
    if(t.tourism&&['apartment','guest_house','hostel'].indexOf(t.tourism)!==-1)return 'apartment';
    if(t.historic)return 'historic';
    return null;
  }

  function renderPoiElements(elements,filterType){
    if(!poiLayer)return;
    poiLayer.clearLayers();
    Object.keys(APTS).forEach(function(k){delete APTS[k];});
    var count=0;
    elements.forEach(function(el){
      if(!el.lat||!el.lon)return;
      var type=getPoiType(el);
      if(!type)return;
      /* colour override if filtering */
      var clr=POI_CLR[type]||'#64748B';
      var html;
      if(type==='apartment'){
        html=makeAptPopup(el);
      }else{
        html=makePOIPopup(el,type);
      }
      L.circleMarker([el.lat,el.lon],{radius:7,fillColor:clr,color:'#fff',weight:1.5,opacity:1,fillOpacity:.9})
        .bindPopup(html,{className:'lf-popup',maxWidth:270,closeButton:true})
        .addTo(poiLayer);
      count++;
    });
    showStatus(IS_AR?count+' نتيجة':count+' results');
    setTimeout(function(){showStatus(null);},2000);
  }

  function loadPoi(type){
    if(!map)return;
    var zoom=map.getZoom();
    if(zoom<10){
      poiLayer&&poiLayer.clearLayers();
      showZoomHint(true);
      return;
    }
    showZoomHint(false);

    /* abort previous request */
    if(poiXhr){try{poiXhr.abort();}catch(e){}poiXhr=null;}

    var query=buildOverpassQuery(type,map.getBounds());
    showStatus(IS_AR?'جاري التحميل…':'Loading…');

    var xhr=new XMLHttpRequest();
    poiXhr=xhr;
    xhr.open('POST','https://overpass-api.de/api/interpreter',true);
    xhr.setRequestHeader('Content-Type','application/x-www-form-urlencoded');
    xhr.timeout=30000;
    xhr.onload=function(){
      if(xhr!==poiXhr)return;
      poiXhr=null;
      try{renderPoiElements(JSON.parse(xhr.responseText).elements||[],type);}catch(e){showStatus(null);}
    };
    xhr.onerror=xhr.ontimeout=function(){poiXhr=null;showStatus(null);};
    xhr.send('data='+encodeURIComponent(query));
  }

  /* Re-query on map move/zoom */
  var moveTimer=null;

  /* ── Language setup ── */
  function setLang(ar){
    IS_AR=ar;
    var dir=ar?'rtl':'ltr';
    document.documentElement.dir=dir;
    document.getElementById('btn-all').textContent=ar?'🌍 الكل':'🌍 All';
    document.getElementById('btn-att').textContent=ar?'🏛 سياحة':'🏛 Tourism';
    document.getElementById('btn-hot').textContent=ar?'🏨 فنادق':'🏨 Hotels';
    document.getElementById('btn-rest').textContent=ar?'🍽 مطاعم':'🍽 Rest.';
    document.getElementById('btn-cafe').textContent=ar?'☕ كافيهات':'☕ Cafes';
    document.getElementById('btn-apt').textContent=ar?'🏠 شقق':'🏠 Apts';
  }

  /* ── Filter buttons ── */
  function clearActive(){document.querySelectorAll('.fbtn').forEach(function(b){b.classList.remove('active','active-apt');});}
  window.filterAll=function(btn){clearActive();btn.classList.add('active');currentFilter=null;if(map)map.addLayer(tourismLayer);loadPoi(null);};
  window.filterPoi=function(btn,type){clearActive();btn.classList.add('active');currentFilter=type;if(map)map.addLayer(tourismLayer);loadPoi(type);};
  window.filterApt=function(btn){clearActive();btn.classList.add('active-apt');currentFilter='apartment';if(map)map.removeLayer(tourismLayer);loadPoi('apartment');};

  document.getElementById('btn-all').onclick=function(){window.filterAll(this);};
  document.getElementById('btn-att').onclick=function(){window.filterPoi(this,'attraction');};
  document.getElementById('btn-hot').onclick=function(){window.filterPoi(this,'hotel');};
  document.getElementById('btn-rest').onclick=function(){window.filterPoi(this,'restaurant');};
  document.getElementById('btn-cafe').onclick=function(){window.filterPoi(this,'cafe');};
  document.getElementById('btn-apt').onclick=function(){window.filterApt(this);};

  var userMarker=null;

  function initMap(cfg){
    var newLat=cfg.userLat||24.7136;
    var newLng=cfg.userLng||46.6753;
    var newAr=!!cfg.isAr;
    var newSpots=cfg.spots||[];

    /* Already initialised — just update */
    if(map){
      var langChanged=(newAr!==IS_AR);
      var locChanged=(newLat!==USER_LAT||newLng!==USER_LNG);
      IS_AR=newAr;USER_LAT=newLat;USER_LNG=newLng;SPOTS=newSpots;
      if(langChanged)setLang(IS_AR);
      if(locChanged){
        map.setView([USER_LAT,USER_LNG]);
        if(userMarker){map.removeLayer(userMarker);}
        userMarker=L.circleMarker([USER_LAT,USER_LNG],{radius:10,fillColor:'#6366F1',color:'#fff',weight:2.5,opacity:1,fillOpacity:.95}).addTo(map);
        if(SPOTS.length)renderTourism();
        loadPoi(currentFilter);
      }
      return;
    }

    /* First init */
    IS_AR=newAr;USER_LAT=newLat;USER_LNG=newLng;SPOTS=newSpots;
    setLang(IS_AR);

    var ov=document.getElementById('loading-overlay');
    if(ov)ov.style.display='none';

    map=L.map('map',{center:[USER_LAT,USER_LNG],zoom:12,zoomControl:false,attributionControl:true});
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com">CARTO</a>',subdomains:'abcd',maxZoom:19}).addTo(map);
    tourismLayer=L.layerGroup().addTo(map);
    poiLayer=L.layerGroup().addTo(map);

    userMarker=L.circleMarker([USER_LAT,USER_LNG],{radius:10,fillColor:'#6366F1',color:'#fff',weight:2.5,opacity:1,fillOpacity:.95}).bindPopup('<div class="pop-name">📍 '+(IS_AR?'موقعك الحالي':'Your Location')+'</div>',{className:'lf-popup'}).addTo(map);

    if(SPOTS.length){renderTourism();setInterval(renderTourism,15*60*1000);}
    loadPoi(null);

    /* Re-load POI after panning / zooming */
    map.on('moveend',function(){
      clearTimeout(moveTimer);
      moveTimer=setTimeout(function(){loadPoi(currentFilter);},800);
    });
  }

  window.addEventListener('message',function(e){
    try{var d=JSON.parse(e.data);if(d.type==='init')initMap(d);}catch(err){}
  });

})();
</script>
</body>
</html>
