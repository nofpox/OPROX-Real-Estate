kind = "video"
previewPath = "/rkz-promo/"
title = "Rkz — Promotional Film"
version = "1.0.0"
id = "artifacts/rkz-promo"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/rkz-promo/" ]
localPort = 21694

[services.development]
run = "pnpm --filter @workspace/rkz-promo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rkz-promo", "run", "build" ]
publicDir = "artifacts/rkz-promo/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21694"
BASE_PATH = "/rkz-promo/"
