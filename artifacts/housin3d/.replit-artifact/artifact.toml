kind = "web"
previewPath = "/housin3d/"
title = "Housin3D"
version = "1.0.0"
id = "artifacts/housin3d"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/housin3d/" ]
localPort = 21970

[services.development]
run = "pnpm --filter @workspace/housin3d run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/housin3d", "run", "build" ]
publicDir = "artifacts/housin3d/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21970"
BASE_PATH = "/housin3d/"
