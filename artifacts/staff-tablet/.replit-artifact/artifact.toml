kind = "web"
previewPath = "/staff-tablet/"
title = "Staff Tablet"
version = "1.0.0"
id = "artifacts/staff-tablet"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/staff-tablet/" ]
localPort = 21245

[services.development]
run = "pnpm --filter @workspace/staff-tablet run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/staff-tablet", "run", "build" ]
publicDir = "artifacts/staff-tablet/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21245"
BASE_PATH = "/staff-tablet/"
