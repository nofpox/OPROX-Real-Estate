# ──────────────────────────────────────────────────────────────────────────────
# PgBouncer Reference Configuration — Grand PMS Production
# ──────────────────────────────────────────────────────────────────────────────
#
# Purpose
# -------
# At 200k active users, even 4 Node.js cluster workers × 25 pg.Pool connections
# = 100 DB connections can become a bottleneck under burst traffic. PgBouncer in
# transaction-pooling mode multiplexes thousands of short-lived app connections
# down to a small, stable set of real PostgreSQL connections — dramatically
# improving throughput and connection latency.
#
# Deployment (Linux production server)
# -------------------------------------
#   apt install pgbouncer
#   cp infra/pgbouncer.ini /etc/pgbouncer/pgbouncer.ini
#   systemctl enable --now pgbouncer
#   # Point DATABASE_URL at pgbouncer port (5432 → 6432):
#   DATABASE_URL=postgresql://user:pass@127.0.0.1:6432/grandpms
#
# Pool mode selection
# -------------------
# transaction  — Best for Grand PMS (web API, short transactions).
#                Each query borrows a server connection for the transaction only.
#                Supports thousands of idle app connections with ~50 DB ones.
#                Incompatible with LISTEN/NOTIFY, prepared statements across
#                transactions, and SET commands that must persist per-session.
# session      — One server connection per app connection. Safer, lower density.
# statement    — One server connection per statement. Maximum density but
#                incompatible with multi-statement transactions. Not recommended.
#
# ──────────────────────────────────────────────────────────────────────────────

[databases]
# Route grandpms → the real PostgreSQL instance.
# In Replit/cloud deployments, replace with the actual DATABASE_URL host/db.
grandpms = host=127.0.0.1 port=5432 dbname=grandpms

[pgbouncer]
# ── Network ───────────────────────────────────────────────────────────────────
listen_addr     = 127.0.0.1
listen_port     = 6432
unix_socket_dir = /var/run/postgresql   # optional: also accept UNIX socket

# ── Pool sizing ───────────────────────────────────────────────────────────────
# Total real PostgreSQL connections PgBouncer will open.
# PostgreSQL max_connections = 112; reserve 12 for admin/replication → 100 usable.
# PgBouncer takes all 100; app pg.Pool should be small (max=5 per worker) when
# running behind PgBouncer in transaction mode.
pool_mode           = transaction
default_pool_size   = 100          # server-side connections to PostgreSQL
max_client_conn     = 5000         # how many app connections PgBouncer accepts
min_pool_size       = 5            # keep at least 5 warm connections alive
reserve_pool_size   = 10           # extra connections available on burst
reserve_pool_timeout = 3           # seconds to wait before using reserve pool

# ── Timeouts ──────────────────────────────────────────────────────────────────
server_idle_timeout     = 600      # retire idle server connections after 10 min
server_lifetime         = 3600     # recycle each server connection after 1 hour
                                   # (matches pg.Pool maxUses=7500 philosophy)
client_idle_timeout     = 0        # never close idle client connections (API)
query_timeout           = 30       # kill queries running > 30 s
query_wait_timeout      = 15       # reject a client if no server available in 15 s
connect_timeout         = 5        # server connection attempt timeout

# ── Auth ──────────────────────────────────────────────────────────────────────
# Use md5 or scram-sha-256 to match your PostgreSQL pg_hba.conf
auth_type       = md5
auth_file       = /etc/pgbouncer/userlist.txt
# userlist.txt format: "username" "md5passwordhash"

# ── Monitoring ────────────────────────────────────────────────────────────────
# Connect to the virtual database 'pgbouncer' as the admin user to run:
#   SHOW POOLS; SHOW STATS; SHOW CLIENTS; SHOW SERVERS;
admin_users     = pgbouncer_admin
stats_users     = pgbouncer_stats

# ── Logging ───────────────────────────────────────────────────────────────────
log_connections = 0    # disable per-connection logging in production (noisy)
log_disconnections = 0
log_pooler_errors = 1  # always log pool errors
stats_period    = 60   # emit stats summary every 60 s

# ── App-level pool settings when running behind PgBouncer ─────────────────────
# When this config is active, set in the Node.js environment:
#   DATABASE_URL=postgresql://user:pass@127.0.0.1:6432/grandpms
#   POOL_MAX=5        ← small per-worker pool; PgBouncer handles the fanout
#   CLUSTER_WORKERS=4 ← 4 workers × 5 connections = 20 app connections
#                       PgBouncer maps these to up to 100 real PG connections
