          description: Listing detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingResponse"
        "404":
          description: Not found
    patch:
      operationId: updateListing
      tags: [listings]
      summary: Update a listing (auth required)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingResponse"
    delete:
      operationId: deleteListing
      tags: [listings]
      summary: Delete a listing (auth required)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Deleted

  /portal/properties:
    get:
      operationId: getPortalProperties
      summary: Managed properties with live operational stats (requires auth)
      tags: [portal]
      parameters:
        - { name: page,  in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 10 } }
      responses:
        "200":
          description: Properties with occupancy stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalPropertiesPage"
        "401":
          description: Unauthorized

  /portal/bookings:
    get:
      operationId: getPortalBookings
      summary: Bookings across managed properties (requires auth)
      tags: [portal]
      parameters:
        - { name: propertyId, in: query, schema: { type: integer } }
        - { name: status,     in: query, schema: { type: string } }
        - { name: page,       in: query, schema: { type: integer, default: 1 } }
        - { name: limit,      in: query, schema: { type: integer, default: 20 } }
      responses:
        "200":
          description: Portal booking list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalBookingsPage"
        "401":
          description: Unauthorized

  /portal/availability:
    get:
      operationId: getPortalAvailability
      summary: Available rooms for a property during a date range (requires auth)
      tags: [portal]
      parameters:
        - { name: propertyId, in: query, required: true,  schema: { type: integer } }
        - { name: checkIn,    in: query, required: true,  schema: { type: string, format: date } }
        - { name: checkOut,   in: query, required: true,  schema: { type: string, format: date } }
      responses:
        "200":
          description: Available rooms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalAvailabilityPage"
        "401":
          description: Unauthorized

  /portal/financials:
    get:
      operationId: getPortalFinancials
      summary: Financial summary for managed properties (requires auth)
      tags: [portal]
      parameters:
        - { name: propertyId, in: query, schema: { type: integer } }
        - { name: months,     in: query, schema: { type: integer, default: 6 } }
      responses:
        "200":
          description: Financial summary with monthly breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalFinancialsPage"
        "401":
          description: Unauthorized

components:
  schemas:
    Settings:
      type: object
      required: [propertyName, logoText, logoSub, businessMode, enabledModules, companyName, contactEmail, contactPhone, contactAddress, taskTypes, taskRequirements]
      properties:
        propertyName:
          type: string
          description: Display name shown as the dashboard heading and sidebar logo
        logoText:
          type: string
          description: Large serif word in the sidebar logo
        logoSub:
          type: string
          description: Smaller sans-serif word in the sidebar logo
        logoUrl:
          type: string
          nullable: true
          description: URL to the brand logo image (overrides text logo when set)
        businessMode:
          type: string
          description: "hotel | compound | tower | serviced-apartments"
        enabledModules:
          type: array
          items:
            type: string
          description: List of enabled functional module IDs for this client
        companyName:
          type: string
          description: Legal or trading name of the company
        contactEmail:
          type: string
          description: Primary contact email address
        contactPhone:
          type: string
          description: Primary contact phone number
        contactAddress:
          type: string
          description: Office / property address
        taskTypes:
          type: array
          items:
            $ref: "#/components/schemas/TaskType"
          description: Custom task category definitions
        taskRequirements:
          $ref: "#/components/schemas/TaskRequirements"
        navConfig:
          type: array
          items:
            $ref: "#/components/schemas/NavConfigItem"
          description: Ordered list of nav items with per-item visibility flags
        permissionMatrix:
          $ref: "#/components/schemas/PermissionMatrix"
          description: Role-to-routes access matrix; owner-tier roles always bypass this
        primaryColor:
          type: string
          nullable: true
          description: Brand primary color as hex (e.g. #f59e0b); applied to buttons and active states
        secondaryColor:
          type: string
          nullable: true
          description: Brand sidebar/secondary color as hex (e.g. #1e293b)

    SettingsInput:
      type: object
      properties:
        propertyName:
          type: string
        logoText:
          type: string
        logoSub:
          type: string
