        contactPhone:
          type: string
        contactAddress:
          type: string
        taskTypes:
          type: array
          items:
            $ref: "#/components/schemas/TaskType"
        taskRequirements:
          $ref: "#/components/schemas/TaskRequirements"
        navConfig:
          type: array
          items:
            $ref: "#/components/schemas/NavConfigItem"
        permissionMatrix:
